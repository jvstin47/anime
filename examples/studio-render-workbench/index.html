<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Anime.js V4 Studio — Motion Editor Workbench</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0D0E10;
      color: #ECEEF2;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Slotted 960x540 composition stage inside <anime-studio mode="workspace"> */
    .composition-stage {
      position: relative;
      width: 960px;
      height: 540px;
      overflow: hidden;
      background: #111317;
    }

    canvas#scene {
      display: block;
      width: 960px;
      height: 540px;
    }

    /* Synchronized composition-space DOM layers inside the 960x540 frame */
    .stage-hud-overlay {
      position: absolute;
      left: 24px;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .stage-tag {
      background: rgba(13, 14, 16, 0.85);
      border: 1px solid #313640;
      border-radius: 3px;
      padding: 6px 10px;
      font-size: 11px;
      color: #ECEEF2;
    }
    .stage-tag .sub {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9CA3AF;
      margin-bottom: 2px;
    }
    .stage-chips {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }
    .dot-chip {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: #4A9EFF;
    }
  </style>
</head>
<body>
  <div id="stage-root" class="composition-stage">
    <canvas id="scene" width="960" height="540"></canvas>
    <div class="stage-hud-overlay">
      <div class="stage-tag hud-badge-a">
        <div class="sub">Cubic Bezier</div>
        <div>Orbital Matrix</div>
        <div class="stage-chips">
          <div class="dot-chip"></div>
          <div class="dot-chip"></div>
          <div class="dot-chip"></div>
          <div class="dot-chip"></div>
          <div class="dot-chip"></div>
        </div>
      </div>
      <div class="stage-tag hud-badge-b">
        <div class="sub">Timeline Marker</div>
        <div id="phase-readout">Phase: Intro</div>
      </div>
    </div>
  </div>

  <script type="module" src="./index.js"></script>
</body>
</html>
